<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>Treasure Hunt | Find the Next Clue</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Decorative animated background blobs -->
  <div class="bg-decor">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="grid-overlay"></div>
  </div>

  <main class="page">

    <!-- Club Logo -->
    <div class="logo-wrapper">
      <div class="logo-glow"></div>
      <img
        src="assets/EDClogo.png"
        alt="Club Logo"
        class="club-logo"
        id="clubLogo"
      />
    </div>

    <header class="hero">
      <h1 class="title">
        <span class="title-icon">🏆</span>
        <span class="title-text">Treasure Hunt</span>
      </h1>
      <p class="subtitle">
        Scan the QR and enter the PIN from the previous clue to unlock the next clue.
      </p>
    </header>

    <section class="card" id="clueCard">
      <div class="card-glow"></div>

      <div class="stage-badge">
        <span class="stage-dot"></span>
        Stage 01
      </div>

      <form class="clue-form" id="clueForm" autocomplete="off">
        <label for="pinInput" class="field-label">Enter PIN</label>

        <div class="input-wrapper">
          <input
            type="text"
            id="pinInput"
            name="pin"
            class="pin-input"
            placeholder="• • • • •"
            inputmode="text"
            maxlength="5"
            pattern="[A-Za-z0-9]{5}"
          />
          <span class="input-underline"></span>
        </div>

        <button type="submit" class="unlock-btn" id="unlockBtn">
          <span class="btn-label">Unlock Clue</span>
          <span class="btn-icon">→</span>
        </button>

        <div class="message-area" id="messageArea" aria-live="polite"></div>
      </form>
    </section>

    <footer class="footer">
      <p>Powered by <span class="club-name">EDC</span></p>
    </footer>

  </main>

<script src="script.js"></script>
</body>
</html>
